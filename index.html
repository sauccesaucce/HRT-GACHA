<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARUTO GACHAPON 🎰✨</title>
    
    <meta property="og:title" content="HARUTO GACHAPON 🎰🩵">
    <meta property="og:description" content="Spin the gacha to get Haruto's special cover songs!">
    <meta property="og:image" content="machine.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gacha-wrapper">
        <div class="machine-box" id="gachaMachine">
            <img src="machine.png" class="machine-img" id="machineBg" alt="Gashapon Machine">
            <img src="crack.png" class="crack-img" id="crackBtn" alt="Turn Crank" title="Click to Spin!">
            
            <!-- 🥚 ลูกบอลเริ่มต้น -->
            <img src="ball_white.PNG" class="ball-img" id="gachaBall" alt="Gacha Ball">

            <div class="reveal-box" id="revealBox">
                <!-- ✨ ประกายดาวพิกเซลมินิมอลรอบไข่ -->
                <div class="pixel-stars">
                    <span class="star s1">✦</span>
                    <span class="star s2">✧</span>
                    <span class="star s3">⋆</span>
                    <span class="star s4">✦</span>
                    <span class="star s5">✧</span>
                </div>

                <!-- 🎁 รูปตอนเปิด -->
                <img src="reveal_white.PNG" class="reveal-img" id="revealImg" alt="Reveal Prize">
                
                <div class="paper-text" id="paperText">
                    <span class="song-name" id="songName">TITLE</span>
                    
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
